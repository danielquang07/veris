# Keeps the Render backend awake: the free plan sleeps after ~15 minutes idle.
# Set the repo variable BACKEND_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://veris-backend.onrender.com (no trailing slash).
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub may delay scheduled runs, so 5 min keeps a margin under 15
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Repo variable BACKEND_URL is not set"
            exit 1
          fi
          # A cold start on Render can take ~50s, hence the long timeout and retries
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$BACKEND_URL/api/health"
