[package]
name = "veris_registry"
version = "0.1.0"
description = "Immutable scam report + AI result registry (Veris)"
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]
name = "veris_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
